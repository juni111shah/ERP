<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HigherSquare 360 ad stage</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('../../../mobile/assets/fonts/Inter-Regular.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('../../../mobile/assets/fonts/Inter-Medium.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('../../../mobile/assets/fonts/Inter-SemiBold.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 700 900; src: url('../../../mobile/assets/fonts/Inter-Bold.ttf'); }
  @font-face { font-family: 'Noto Sans Arabic'; font-weight: 700; src: url('../../../mobile/assets/fonts/NotoSansArabic-Bold.ttf'); }
  :root { --green: #4FA077; --green2: #6FD39A; --mint: #7FE0A8; --teal: #2A8A93; --navy: #1F3A44; --ink: #0B1E24; --sky: #38BDF8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: var(--ink); }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #root { position: relative; overflow: hidden; }
  .abs { position: absolute; }
  #bg { position: absolute; inset: 0; background: linear-gradient(160deg, #0A1C22 0%, #11303A 52%, #0D2B27 100%); }
  #bg .blob { position: absolute; border-radius: 50%; }
  #bg .dots { position: absolute; inset: -10%; background-image: radial-gradient(rgba(255,255,255,.075) 1.2px, transparent 1.6px); }
  #bg .p { position: absolute; border-radius: 50%; background: #BFF5D8; }
  #bg .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
  .scene { position: absolute; inset: 0; display: none; transform-origin: 50% 50%; }
  .w { display: inline-block; white-space: pre; will-change: transform; }
  .hl { color: var(--mint); background-image: linear-gradient(90deg, rgba(79,160,119,.55), rgba(79,160,119,.55)); background-repeat: no-repeat; background-position: 0 88%; padding: 0 .08em; margin: 0 -.08em; }
  .bad { color: #FF8A80; position: relative; }
  .strike { position: absolute; left: -2%; top: 52%; height: .09em; background: #FF5A4E; border-radius: .05em; box-shadow: 0 0 .3em rgba(255,90,78,.7); }
  .kicker { font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--mint); }
  .title { font-weight: 800; letter-spacing: -.025em; line-height: 1.04; }
  .device { position: absolute; border-radius: 1.4vmin; background: #0F1D22; box-shadow: 0 4vmin 9vmin rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); overflow: hidden; transform-style: preserve-3d; }
  .device .bar { height: 4.2vmin; background: linear-gradient(#1C2E35, #16262C); display: flex; align-items: center; gap: .9vmin; padding: 0 1.6vmin; }
  .device .bar i { width: 1.25vmin; height: 1.25vmin; border-radius: 50%; display: block; }
  .device .bar .url { margin-left: 2vmin; flex: 1; height: 2.5vmin; border-radius: 1.3vmin; background: rgba(255,255,255,.07); display: flex; align-items: center; gap: .8vmin; padding: 0 1.4vmin; font-size: 1.35vmin; color: rgba(255,255,255,.62); font-weight: 500; }
  .device .bar .url img { width: 1.6vmin; height: 1.6vmin; border-radius: .35vmin; }
  .screen { position: relative; overflow: hidden; background: #fff; }
  .screen img.f { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(79,160,119,.55), transparent); filter: blur(2vmin); }
  .chip { position: absolute; display: flex; align-items: center; gap: 1.4vmin; padding: 1.3vmin 2.6vmin 1.3vmin 1.4vmin; border-radius: 999px; background: rgba(16,40,46,.88); border: 1px solid rgba(127,224,168,.35); box-shadow: 0 1.6vmin 4vmin rgba(0,0,0,.35); font-weight: 600; white-space: nowrap; }
  .chip .ok { width: 3.6vmin; height: 3.6vmin; border-radius: 50%; background: linear-gradient(135deg, #5DBE8A, #3A8A62); display: grid; place-items: center; font-size: 2.2vmin; color: #fff; font-weight: 800; }
  .pop { position: absolute; overflow: hidden; border-radius: 1.8vmin; background: #fff; box-shadow: 0 3vmin 8vmin rgba(0,0,0,.6), 0 0 0 .45vmin rgba(127,224,168,.9); }
  .pop img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .label { position: absolute; padding: 1vmin 2.4vmin; border-radius: 999px; background: linear-gradient(135deg, #5DBE8A, #2A8A93); font-weight: 700; box-shadow: 0 1.4vmin 3vmin rgba(0,0,0,.35); white-space: nowrap; }
  .phone { position: absolute; border-radius: 6vmin; background: #05090B; box-shadow: 0 5vmin 12vmin rgba(0,0,0,.6), inset 0 0 0 .35vmin #2A3A40, 0 0 0 .3vmin #43555B; }
  .phone .screen { position: absolute; border-radius: 4.6vmin; background: #F4F6F8; }
  .phone .cam { position: absolute; left: 50%; top: 2.4vmin; width: 2.2vmin; height: 2.2vmin; margin-left: -1.1vmin; border-radius: 50%; background: #000; box-shadow: 0 0 0 .3vmin #1A2428; z-index: 3; }
  .note { position: absolute; display: flex; gap: 2vmin; align-items: center; padding: 2.2vmin 3vmin 2.2vmin 2.2vmin; border-radius: 3vmin; background: rgba(255,255,255,.97); color: #10232A; box-shadow: 0 3vmin 7vmin rgba(0,0,0,.45); }
  .note img { width: 7vmin; height: 7vmin; border-radius: 1.6vmin; }
  .note b { display: block; font-size: 2.9vmin; font-weight: 800; }
  .note span { display: block; font-size: 2.5vmin; color: #4A5D63; margin-top: .4vmin; font-weight: 500; }
  .note em { position: absolute; right: 2.4vmin; top: 1.8vmin; font-style: normal; font-size: 2vmin; color: #7A8A90; font-weight: 600; }
  .done { position: absolute; display: flex; align-items: center; gap: 1.6vmin; padding: 1.8vmin 4vmin 1.8vmin 1.8vmin; border-radius: 999px; background: linear-gradient(135deg, #5DBE8A, #2F8058); font-weight: 800; box-shadow: 0 2.4vmin 6vmin rgba(47,128,88,.6); }
  .done .ok { width: 5vmin; height: 5vmin; border-radius: 50%; background: #fff; color: #2F8058; display: grid; place-items: center; font-size: 3.2vmin; font-weight: 900; }
  .ring { position: absolute; border-radius: 50%; border: .5vmin solid rgba(127,224,168,.8); }
  .btn { position: absolute; display: grid; place-items: center; border-radius: 999px; background: linear-gradient(135deg, #5DBE8A, #2A8A93); font-weight: 800; box-shadow: 0 2.6vmin 6vmin rgba(42,138,147,.55); overflow: hidden; }
  .btn .shine { position: absolute; top: -20%; bottom: -20%; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); }
  .rays { position: absolute; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(127,224,168,.16) 0deg 6deg, transparent 6deg 18deg); -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 100%); mask: radial-gradient(closest-side, #000 20%, transparent 100%); }
  .cursor { position: absolute; width: 5vmin; height: 5vmin; filter: drop-shadow(0 .5vmin 1vmin rgba(0,0,0,.45)); }
  .ripple { position: absolute; border-radius: 50%; border: .5vmin solid #fff; }
  #corner { position: absolute; display: flex; align-items: center; gap: 1.2vmin; font-weight: 800; letter-spacing: -.02em; }
  #corner img { border-radius: 22%; }
  #corner .a { color: #4ADE80; } #corner .b { color: #38BDF8; }
  #sweep { position: absolute; display: none; }
  #flashw { position: absolute; inset: 0; background: #fff; display: none; }
  .sheet { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  .cell { position: absolute; border: 1px solid rgba(160,220,200,.22); color: rgba(200,240,225,.35); font: 500 1.6vmin 'Inter', monospace; display: flex; align-items: center; padding-left: .8vmin; overflow: hidden; white-space: nowrap; }
  .word { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; letter-spacing: -.03em; text-shadow: 0 1vmin 3vmin rgba(0,0,0,.55); }
</style>
</head>
<body>
<div id="root"></div>
<script src="stage.js"></script>
</body>
</html>
