<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5447" />
      <stop offset="100%" stop-color="#113a30" />
    </linearGradient>
    <linearGradient id="emblemScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f7566" />
      <stop offset="50%" stop-color="#14574c" />
      <stop offset="100%" stop-color="#0c382f" />
    </linearGradient>
    <linearGradient id="emblemLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="emblemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#06221c" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#emblemShadow)">
    <!-- Gear Outer Teeth -->
    <rect x="48" y="6" width="28" height="22" rx="5" fill="#1b4d41" />
    <rect x="124" y="6" width="28" height="22" rx="5" fill="#1b4d41" />
    
    <rect x="48" y="172" width="28" height="22" rx="5" fill="#133d32" />
    <rect x="124" y="172" width="28" height="22" rx="5" fill="#133d32" />
    
    <rect x="6" y="48" width="22" height="28" rx="5" fill="#18473c" />
    <rect x="6" y="124" width="22" height="28" rx="5" fill="#143e33" />
    
    <rect x="172" y="48" width="22" height="28" rx="5" fill="#18473c" />
    <rect x="172" y="124" width="22" height="28" rx="5" fill="#143e33" />

    <!-- Gear Main Body -->
    <rect x="18" y="18" width="164" height="164" rx="34" fill="url(#emblemGear)" stroke="#236858" stroke-width="2.5" />

    <!-- Inner Screen Display -->
    <rect x="30" y="30" width="140" height="140" rx="22" fill="url(#emblemScreen)" stroke="#2ea38d" stroke-width="2.5" />

    <!-- Screen Highlight Border -->
    <rect x="34" y="34" width="132" height="132" rx="18" fill="none" stroke="#5eead4" stroke-width="1" stroke-opacity="0.3" />

    <!-- Rising Line Chart Path -->
    <path d="M 52 124 L 84 90 L 114 110 L 148 52" 
          fill="none" 
          stroke="url(#emblemLine)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Chart Nodes -->
    <circle cx="52" cy="124" r="7.5" fill="#2dd4bf" stroke="#134e44" stroke-width="2" />
    <circle cx="84" cy="90" r="7.5" fill="#2dd4bf" stroke="#134e44" stroke-width="2" />
    <circle cx="114" cy="110" r="7.5" fill="#2dd4bf" stroke="#134e44" stroke-width="2" />
    
    <!-- Top Peak Node Ring -->
    <circle cx="148" cy="52" r="14" fill="#0c382f" stroke="url(#emblemLine)" stroke-width="6.5" />
    <circle cx="148" cy="52" r="4" fill="#5eead4" />
  </g>
</svg>
