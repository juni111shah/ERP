# Build + test only; deploys nothing (deploys are in cicd.yml).
# The job `name:` values below are the check names GitHub shows and that branch rules/rulesets require.
# Keep them stable: renaming a job breaks any required-status-check rule that references it.
#   Required check contexts: "Backend build and test", "Frontend build"
name: CI
on:
  push: { branches: [main, 'antigravity/**', 'claude/**', 'cursor/**', 'codex/**'] }
  pull_request: { branches: [main, dev, staging, production] }
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: backend/global.json }
      - run: dotnet build ERP.sln -c Release
      - run: dotnet test ERP.sln -c Release --no-build --logger trx --results-directory TestResults
      # TEMP(claude/permissions): failed tests as annotations, readable without signing in. Removed before the branch is finished.
      - name: Report failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          fails = []
          for f in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(f).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") == "Failed":
                      m = r.find(".//t:Message", ns)
                      fails.append(r.get("testName") + " :: " + ((m.text or "") if m is not None else ""))
          print(f"{len(fails)} failed")
          for i in range(0, len(fails), 3):
              chunk = " || ".join(x.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:6000] for x in fails[i:i + 3])
              print(f"::error title=Failed tests {i + 1}-{min(i + 3, len(fails))} of {len(fails)}::{chunk}")
          PY
      - name: Fail on High or Critical vulnerable packages
        run: |
          dotnet list ERP.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '> .*(High|Critical)' vuln.txt; then echo 'High or Critical vulnerable package found'; exit 1; fi
      - name: Every new migration has a script in database/scripts
        working-directory: .
        run: |
          # Migrations from 20261029000000 on must appear (by MigrationId) in a script; older ones were scripted in grouped files.
          status=0
          for f in backend/src/ERP.Infrastructure/Persistence/Migrations/*.cs; do
            id=$(basename "$f" .cs)
            case "$id" in *.Designer|*Snapshot) continue;; esac
            [ "${id%%_*}" -ge 20261029000000 ] || continue
            grep -rqF "$id" database/scripts || { echo "No script for migration $id"; status=1; }
          done
          exit $status
  backend-sql:
    name: Backend SQL Server tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'Ci#Test-Passw0rd' }
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci#Test-Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: backend/global.json }
      - run: dotnet build ERP.sln -c Release
      - run: dotnet test tests/ERP.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~ParallelIssuingTests"
        env:
          ERP_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci#Test-Passw0rd;TrustServerCertificate=true
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:a11y
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadless 2>&1 | tee ng-test.log; exit ${PIPESTATUS[0]}
        shell: bash
      # TEMP(claude/permissions): failed specs as annotations. Removed before the branch is finished.
      - name: Report failed specs
        if: failure()
        run: grep -E "FAILED|Error:|Expected" ng-test.log | head -60 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 } END { print "" }' | sed 's/^/::error title=Failed specs::/'
