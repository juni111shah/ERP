# Build + test only; deploys nothing (deploys are in cicd.yml).
# The job `name:` values below are the check names GitHub shows and that branch rules/rulesets require.
# Keep them stable: renaming a job breaks any required-status-check rule that references it.
#   Required check contexts: "Backend build and test", "Frontend build"
name: CI
on:
  push: { branches: [main, 'antigravity/**', 'claude/**', 'cursor/**', 'codex/**'] }
  pull_request: { branches: [main, dev, staging, production] }
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: backend/global.json }
      - run: dotnet build ERP.sln -c Release
      - run: dotnet test ERP.sln -c Release --no-build
      - name: Fail on High or Critical vulnerable packages
        run: |
          dotnet list ERP.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '> .*(High|Critical)' vuln.txt; then echo 'High or Critical vulnerable package found'; exit 1; fi
      - name: Every new migration has a script in database/scripts
        working-directory: .
        run: |
          # Migrations from 20261029000000 on must appear (by MigrationId) in a script; older ones were scripted in grouped files.
          status=0
          for f in backend/src/ERP.Infrastructure/Persistence/Migrations/*.cs; do
            id=$(basename "$f" .cs)
            case "$id" in *.Designer|*Snapshot) continue;; esac
            [ "${id%%_*}" -ge 20261029000000 ] || continue
            grep -rqF "$id" database/scripts || { echo "No script for migration $id"; status=1; }
          done
          exit $status
  backend-sql:
    name: Backend SQL Server tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'Ci#Test-Passw0rd' }
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci#Test-Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: backend/global.json }
      - run: dotnet build ERP.sln -c Release
      - run: dotnet test tests/ERP.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~ParallelIssuingTests"
        env:
          ERP_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci#Test-Passw0rd;TrustServerCertificate=true
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:a11y
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadless
