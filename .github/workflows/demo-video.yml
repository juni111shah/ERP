# Records the client demo videos (tools/demo-video) on Linux runners: SQL Server + the API with demo data + the web app in Chrome,
# and the Flutter app on an Android emulator. tools/demo-video/ci-mode.txt picks "explore" (screenshots of every screen) or
# "record" (the finished videos). Put [web-only] or [mobile-only] in the commit message to run one job. Results go to the branches demo-video-out-web / demo-video-out-mobile and to the run's artifacts.
name: Demo video
on:
  push:
    branches: [claude/demo-video]
    paths: ['tools/demo-video/**', '.github/workflows/demo-video.yml']
  workflow_dispatch: {}

permissions:
  contents: write


env:
  SQL_PASSWORD: 'Demo#Video-Passw0rd1'
  MUSIC_URL: 'https://cdn.pixabay.com/download/audio/2026/10/09/audio_7bcb446346.mp3'   # "Upbeat Corporate" by AtlasAudio, Pixabay Content License

jobs:
  web:
    name: Web demo
    if: ${{ !contains(github.event.head_commit.message, '[mobile-only]') }}
    concurrency: { group: demo-video-web, cancel-in-progress: true }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'Demo#Video-Passw0rd1' }
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Demo#Video-Passw0rd1' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: backend/global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-noto-core fonts-noto-color-emoji > /dev/null
      - name: Start API with demo data
        run: bash tools/demo-video/ci/start-stack.sh
      - name: Toolkit
        working-directory: tools/demo-video
        run: npm ci --no-audit --no-fund && curl -fsSL -A "Mozilla/5.0" -e https://pixabay.com/ -o assets/music.mp3 "$MUSIC_URL" || true
      - name: Explore or record
        working-directory: tools/demo-video
        run: |
          mkdir -p assets
          if [ "$(tr -d '[:space:]' < ci-mode.txt)" = "record" ]; then
            node voice.mjs web
            node record-web.mjs http://localhost:4200
            node build.mjs web
          else
            node explore-web.mjs http://localhost:4200
          fi
      - name: Publish
        if: always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: bash tools/demo-video/ci/publish.sh web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video-web
          path: |
            tools/demo-video/out/
            tools/demo-video/work/explore-web/
            api.log
          retention-days: 14

  mobile:
    name: Mobile demo
    if: ${{ !contains(github.event.head_commit.message, '[web-only]') }}
    concurrency: { group: demo-video-mobile, cancel-in-progress: true }
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'Demo#Video-Passw0rd1' }
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Demo#Video-Passw0rd1' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - name: Free disk space
        run: sudo rm -rf /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules/@angular || true
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: backend/global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.9, cache: true }
      - name: Fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-noto-core > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start API with demo data
        run: SKIP_WEB=1 bash tools/demo-video/ci/start-stack.sh
      - name: Build the app
        working-directory: mobile
        run: flutter pub get && flutter build apk --debug
      - name: Toolkit
        working-directory: tools/demo-video
        run: npm ci --no-audit --no-fund && mkdir -p assets && (curl -fsSL -A "Mozilla/5.0" -e https://pixabay.com/ -o assets/music.mp3 "$MUSIC_URL" || true) && node voice.mjs mobile
      - name: Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash tools/demo-video/ci/mobile.sh
      - name: Build video
        working-directory: tools/demo-video
        run: if [ "$(tr -d '[:space:]' < ci-mode.txt)" = "record" ]; then node build.mjs mobile; fi
      - name: Publish
        if: always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: bash tools/demo-video/ci/publish.sh mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video-mobile
          path: |
            tools/demo-video/out/
            tools/demo-video/work/explore-mobile/
            tools/demo-video/work/rec/
            api.log
          retention-days: 14
